openapi: 3.0.0
info:
  title: API Documentation
  version: 1.0.0

tags:
  - name: Auth
    description: API for authentication

paths:
  /api/auth/login:
    post:
      summary: Log in and receive a JWT access token
      description: >
        On success, a `refreshToken` is also set as an httpOnly cookie
        (scoped to the `/api/auth` path) for use with the refresh and
        logout endpoints.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginInput"
      responses:
        200:
          description: Successful login
          headers:
            Set-Cookie:
              description: httpOnly refreshToken cookie, path=/api/auth
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginOutput"
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorListOutput"
        401:
          description: Invalid login/email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorListOutput"
        404:
          description: User with the given login or email was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorListOutput"

  /api/auth/refresh-token:
    post:
      summary: Issue a new access/refresh token pair using the refresh token cookie
      description: >
        Reads the refresh token from the httpOnly `refreshToken` cookie,
        verifies it, and rotates it: the used token is blacklisted and a
        new access/refresh token pair is issued. The new refresh token is
        set as an httpOnly cookie (scoped to the `/api/auth` path).
      tags: [Auth]
      responses:
        200:
          description: New access token issued, refresh token cookie rotated
          headers:
            Set-Cookie:
              description: httpOnly refreshToken cookie, path=/api/auth
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginOutput"
        401:
          description: Missing, malformed, expired, or blacklisted refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorListOutput"

  /api/auth/logout:
    post:
      summary: Log out and invalidate the current refresh token
      description: >
        Blacklists the refresh token from the httpOnly `refreshToken`
        cookie and clears the cookie. Requires a valid access token.
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        204:
          description: Successfully logged out, refresh token cookie cleared
        401:
          description: >
            Missing/invalid access token, or missing, malformed, expired,
            or blacklisted refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorListOutput"

  /api/auth/me:
    get:
      summary: Get information about the currently authenticated user
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        200:
          description: The authenticated user's data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserView"
        401:
          description: Missing, malformed, or invalid/expired JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorListOutput"

  /api/auth/registration:
    post:
      summary: Register a new user and send an email confirmation code
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateInput"
      responses:
        201:
          description: User registered successfully, confirmation email sent
        400:
          description: Validation error, or user with this login/email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorListOutput"

  /api/auth/registration-confirmation:
    post:
      summary: Confirm registration by email confirmation code
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationConfirmationInput"
      responses:
        204:
          description: Email successfully confirmed
        400:
          description: Validation error, or confirmation code is expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorListOutput"
        404:
          description: User with the given confirmation code was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorListOutput"

  /api/auth/registration-email-resending:
    post:
      summary: Resend the email confirmation code
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationEmailResendingInput"
      responses:
        204:
          description: Confirmation email resent successfully
        400:
          description: Validation error, or the previous confirmation code has not expired yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorListOutput"
        404:
          description: User with the given email was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorListOutput"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthLoginInput:
      type: object
      required:
        - loginOrEmail
        - password
      properties:
        loginOrEmail:
          type: string
          minLength: 2
          maxLength: 100
          description: User login or email
          example: janedoe
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 15
          example: "P@ssw0rd123"

    AuthLoginOutput:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: JWT access token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.dozjgNryP4J3jVmNHl0w5N_XgL0n3I9PlFUP0THsR8U

    RegistrationConfirmationInput:
      type: object
      required:
        - emailConfirmationCode
      properties:
        emailConfirmationCode:
          type: string
          format: uuid
          description: Email confirmation code sent to the user's email
          example: 3a2f1b4c-5d6e-7f8g-9h0i-1j2k3l4m5n6o

    RegistrationEmailResendingInput:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          minLength: 5
          maxLength: 100
          description: Email to resend the confirmation code to
          example: jane.doe@example.com

    UserView:
      type: object
      required:
        - type
        - id
        - attributes
      properties:
        type:
          type: string
          enum: [users]
          example: users
        id:
          type: string
          example: 5f1a2b3c4d5e6f7g8h9i0j1k2
        attributes:
          type: object
          required:
            - firstName
            - lastName
            - middleName
            - phoneNumber
            - email
            - createdAt
            - emailConfirmation
          properties:
            firstName:
              type: string
              example: Jane
            lastName:
              type: string
              example: Doe
            middleName:
              type: string
              nullable: true
              example: null
            phoneNumber:
              type: string
              example: "+1234567890"
            email:
              type: string
              format: email
              example: jane.doe@example.com
            createdAt:
              type: string
              format: date-time
              example: 2023-03-05T12:00:00Z
            emailConfirmation:
              $ref: "#/components/schemas/EmailConfirmationOutput"
