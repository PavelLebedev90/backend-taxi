openapi: 3.0.0
info:
  title: API Documentation
  version: 1.0.0

tags:
  - name: Auth
    description: API for authentication

paths:
  /api/auth/login:
    post:
      summary: Log in and receive a JWT access token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginInput"
      responses:
        200:
          description: Successful login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginOutput"
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorListOutput"
        401:
          description: Invalid login/email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorListOutput"
        404:
          description: User with the given login or email was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorListOutput"

  /api/auth/me:
    get:
      summary: Get information about the currently authenticated user
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        200:
          description: The authenticated user's data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDataViewOutput"
        401:
          description: Missing, malformed, or invalid/expired JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorListOutput"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthLoginInput:
      type: object
      required:
        - loginOrEmail
        - password
      properties:
        loginOrEmail:
          type: string
          minLength: 2
          maxLength: 100
          description: User login or email
          example: janedoe
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 15
          example: "P@ssw0rd123"

    AuthLoginOutput:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: JWT access token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.dozjgNryP4J3jVmNHl0w5N_XgL0n3I9PlFUP0THsR8U
